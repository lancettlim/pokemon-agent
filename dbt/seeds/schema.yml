version: 2

seeds:
  - name: champions_regulations
    description: >
      The Pokémon Champions regulation registry: one row per regulation
      set, and the single place the pipeline learns which formats count as
      Champions. RK9 and Limitless extraction (via
      pipelines/regulations.py), int_champions_roster and
      tournament_event.regulation_code all read it. Before this seed
      existed the format was hardcoded to Reg M-A in three places, so the
      2026 World Championships (M-B) and every M-C event were silently
      dropped (docs/upgrade-plan-2026q4.md, A1).

      Adding a regulation is a one-row change here.
      assert_champions_formats_registered fails the build if MunchStats or
      Limitless report a Champions format that has no row, so a new
      regulation can't go missing silently again. Dates come from the
      official regulation announcements (via victoryroad.pro's
      champions-regulations page). end_date is exclusive and equals the
      next set's start_date.
    columns:
      - name: regulation_code
        description: Lowercase regulation slug ("m-c"), the same code PokéBase uses for legality_snapshot.regulation_code.
        tests: [unique, not_null]
      - name: regulation_name
        description: Display name ("Regulation Set M-C").
      - name: munchstats_format
        description: The value MunchStats' tournaments_index.json reports in `format` for events played under this set.
        tests: [unique, not_null]
      - name: limitless_format
        description: Limitless VGC's data-format slug for this set (staged as limitless.regulation_set).
        tests: [unique, not_null]
      - name: limitless_play_format
        description: The `format` label Limitless' online tournament platform (play.limitlesstcg.com) gives this set, "M-C" (docs/upgrade-plan-2027q2.md, S1). pipelines/extract/limitless_play.py and tournament_event.regulation_code match it case-insensitively.
        tests: [unique, not_null]
      - name: start_date
        description: First day the set is in force (inclusive, ISO-8601).
      - name: end_date
        description: Day the next set takes over (exclusive, ISO-8601).
  - name: featured_match_vods
    description: >
      Curated "Watch on stream" links (docs/upgrade-plan-2027q2.md, S5 and
      E5): one row per top-cut match with a video of it, keyed by the
      match's event, round and table as RK9 reports them. Only videos that
      are the match itself are listed: Play! Pokémon's dedicated finals
      uploads ("<player> vs <player> - Pokémon VGC Masters Finals |
      <event>"), each checked through YouTube's oEmbed endpoint for its
      title (both finalists named) and its channel (Play Pokémon) on
      checked_on. A match inside a day-long stream needs a timestamp
      someone has watched for, so none is guessed: add a row with `t` when
      one is known. tournament_top_cut_matches carries the link, and
      assert_featured_match_vods_resolve fails the build when a row names
      no real top-cut match.
    columns:
      - name: event_id
        description: The match's tournament_event.event_id.
        tests: [not_null]
      - name: round_number
        description: The RK9 round the match was played in.
        tests: [not_null]
      - name: table_number
        description: The match's RK9 table.
        tests: [not_null]
      - name: url
        description: The video's https://www.youtube.com/watch?v=<id> link.
        tests: [unique, not_null]
      - name: t
        description: Seconds into the video the match starts (0 for a video that is the match).
        tests: [not_null]
      - name: video_title
        description: The video's title when it was checked, kept so a reviewer can see what it was matched on.
      - name: checked_on
        description: The date the link, title and channel were checked (ISO-8601).
  - name: opgg_key_to_pokeapi_form
    description: >
      Controlled name/form mapping (dataset-spec.md's OP.GG mapping rule:
      "Join to canonical records by numeric ID where available. Fall back
      to controlled name/form mappings when direct ID mapping is absent")
      from every OP.GG `source_record_id` key to PokéAPI's `form_name`
      slug. Used for all OP.GG rows, not just the ones with a fabricated
      (null-`pokemon_id`) key: OP.GG's numeric id alone doesn't disambiguate
      species with no single default PokéAPI slug (e.g. "pyroar", "lycanroc",
      "gourgeist-average"), so name-based resolution is more precise even
      when a real id is present.

      Built by fetching PokéAPI's full /pokemon list and matching each
      OP.GG key against it: first a direct match (most keys already equal a
      real PokéAPI slug), then narrow verified transforms — reordering
      OP.GG's `mega-<species>[-x|-y]` prefix into PokéAPI's
      `<species>-mega[-x|-y]` suffix convention, renaming OP.GG's
      `-alolan`/`-galarian`/`-hisuian` regional suffixes to PokéAPI's
      `-alola`/`-galar`/`-hisui`, stripping literal periods (e.g.
      "mr.-rime" -> "mr-rime"), and two explicit overrides (Paldean
      Tauros's `-breed` forms; "floette-eternal-flower" ->
      "floette-eternal") — then, for keys ending in `-female`/`-male` or
      bare species names that still don't resolve, the species' PokéAPI-
      designated `is_default: true` variety (queried via
      /pokemon-species/{name}), e.g. OP.GG's "vileplume-female" and
      "pyroar" both resolve through this path since PokéAPI doesn't model
      those as separate forms. Every row was confirmed against live
      PokéAPI data; no fuzzy/heuristic matches were kept. 316/317 OP.GG
      legal-pool keys resolved. One key (`mega-meowstic`) was left out:
      PokéAPI has both `meowstic-male-mega` and `meowstic-female-mega` and
      OP.GG's key doesn't disambiguate, so no override was added rather
      than guess.
    columns:
      - name: opgg_key
        description: OP.GG's source_record_id for the unmapped row.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.

  - name: munchstats_name_to_pokeapi_form
    description: >
      Controlled name/form mapping (dataset-spec.md's MunchStats "map roster
      Pokémon names to canonical pokemon_id and pokemon_key" rule) from every
      distinct `pokemon_name` value in stg_munchstats to PokéAPI's
      `form_name` slug.

      Built the same way as opgg_key_to_pokeapi_form: fetch PokéAPI's live
      /pokemon list, normalize each MunchStats name (lowercase; spaces and
      periods to hyphens, e.g. "Flutter Mane" -> "flutter-mane", "Mr. Rime"
      -> "mr-rime"), then confirm the result is a real PokéAPI slug. Two
      further verified rule sets handle names that don't resolve after that:
      1) an explicit override table for MunchStats names whose slug doesn't
      match PokéAPI's own naming for that form (e.g. "Necrozma-Dusk-Mane" ->
      "necrozma-dusk", "Tauros-Paldea-Aqua" -> "tauros-paldea-aqua-breed",
      "Maushold-Three" -> "maushold-family-of-three"); 2) for MunchStats
      names that are a bare species with no single matching PokéAPI slug
      (e.g. "Giratina", "Urshifu", "Meowstic" — PokéAPI splits these into
      named sub-forms with no bare-species entry), resolve to the form
      PokéAPI itself flags `is_default: true` for that species (queried via
      /pokemon-species/{name}), e.g. "Giratina" -> "giratina-altered". Every
      row was confirmed against live PokéAPI data; 500/500 distinct
      MunchStats names resolved (100% row-level coverage).
    columns:
      - name: munchstats_pokemon_name
        description: stg_munchstats.pokemon_name value.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.

  - name: smogon_name_to_pokeapi_form
    description: >
      Overrides for the Showdown display names in Smogon's ladder statistics
      (docs/upgrade-plan-2027q2.md, S2) that neither
      munchstats_name_to_pokeapi_form nor the slug rule it was built with
      resolves (int_smogon_ladder_names). Two when the source was added: a
      bare "Gourgeist", resolved to the form PokéAPI flags is_default
      (gourgeist-average), as the MunchStats seed does for bare species; and
      "Meowstic-M-Mega", PokéAPI's meowstic-male-mega. All 333 names in the
      September 2026 files resolve. Showdown replays' team preview (S3)
      added four on 2026-10-23: "Maushold-Four" and "Meowstic-F", PokéAPI's
      maushold-family-of-four and meowstic-female, and the cosmetic
      "Sinistcha-Masterpiece" and "Polteageist-Antique", which PokéAPI keeps
      as their species. Cosmetic patterns with many names (Vivillon,
      Florges, Alcremie, Furfrou) take their species by a rule in
      int_smogon_ladder_names instead.
    columns:
      - name: smogon_pokemon_name
        description: The Smogon ladder pokemon_name or counter_name value.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.

  - name: bulbagarden_title_to_pokeapi_form
    description: >
      Controlled name/form mapping (docs/dataset-spec.md's Bulbagarden
      Archives mapping rule) from every `bulbagarden_title` in
      stg_bulbagarden to PokéAPI's `form_name` slug. Bulbagarden's own
      title convention ("Menu Champs <4-digit dex number>[-<Form descriptor>]",
      renamed from "Menu CP" upstream by 2026-10)
      is not the same token set as OP.GG's or PokéAPI's own form-suffix
      naming (e.g. Bulbagarden's "Alola"/"Paldea Aqua" vs. PokéAPI's
      "-alola"/"-paldea-aqua-breed"), so this is a dedicated seed rather
      than a reuse of opgg_key_to_pokeapi_form.

      2026-10-18 refresh: Bulbagarden renamed every title from "Menu CP" to
      "Menu Champs", and the category grew to 393 titles with the Reg M-C
      additions. The 358 existing rows were re-keyed 1:1 by that rename.
      34 new rows were resolved the same way as the originals below (the
      default variety for a bare title; `-mega`, `-mega-z`, `-alola`,
      `-low-key`, `-female` and `-<color>-plumage` suffixes checked against
      live PokéAPI). They include the six new M-C Megas: absol-mega-z,
      salamence-mega, garchomp-mega-z, lucario-mega-z, golisopod-mega and
      baxcalibur-mega. PokéAPI models the "Z" Megas as ordinary forms, so
      they need no Champions-only key. Mega Meowstic stays unmapped for
      the same male/female ambiguity noted below.

      Originally built by fetching the live 359-title category inventory plus
      PokéAPI's full /pokemon list and /pokemon-species data, then: 1) a
      direct match on `<base species slug>-<slugified form descriptor>`
      for the majority of titles; 2) explicit overrides for species whose
      PokéAPI default variety isn't the bare species slug (e.g. Pyroar's
      default is `pyroar-male`, not `pyroar`; Paldean Tauros forms need a
      `-breed` suffix PokéAPI adds that Bulbagarden's title doesn't
      signal); 3) cosmetic-only species (Vivillon's 20 wing patterns,
      Florges's 5 colors, Furfrou's 9 trims, Alcremie's 8 cream flavors) —
      confirmed via live /pokemon-species queries to have exactly one
      PokéAPI variety despite many visually distinct Bulbagarden sprites —
      map every one of that species' titles onto the same single
      `pokeapi_form_name`; int_bulbagarden_mapped.sql dedupes these down to
      one asset row per pokemon_key, the same treatment
      int_opgg_champions_mapped.sql already gives OP.GG's cosmetic
      male/female duplicates.

      One title was left out rather than guessed, matching
      opgg_key_to_pokeapi_form's precedent for the identical case: "File:Menu
      CP 0678-Mega.png" (Mega Meowstic) is ambiguous between PokéAPI's
      `meowstic-male-mega`/`meowstic-female-mega` and Bulbagarden's title
      doesn't disambiguate, so no override was added. 358/359 titles
      resolved (99.7%); every mapped row was confirmed against live
      PokéAPI data, no fuzzy/heuristic matches were kept.
    columns:
      - name: bulbagarden_title
        description: stg_bulbagarden.bulbagarden_title value.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.

  - name: pokeapi_move_types
    description: >
      Static move-name-to-type reference table, sourced once from PokéAPI's
      GitHub `data/v2/csv/moves.csv` + `types.csv` (already cataloged in
      docs/data-sources.md's PokéAPI entry but not otherwise ingested by
      this pipeline). Used only by pipelines/render/ to color a team card's
      move rows by type — not part of the pokemon/tournament_* entity
      graph, so it isn't referenced by any normalized model, dataset-spec.md
      entity, or release gate; the renderer reads it directly via
      csv.DictReader. All 937 PokéAPI moves are included, joined by
      display name (e.g. "double-slap" -> "Double Slap") for exact-match
      lookup against tournament roster move strings.
    columns:
      - name: move_name
        description: Move display name, Title Case (e.g. "Ice Punch").
      - name: move_type
        description: Move's type, lowercase (e.g. "ice").

  - name: archetype_pokemon_map
    description: >
      Competitive-archetype membership map (docs/todo.md M6 backlog).
      Originally built for the dashboard's Archetype Explorer tab, which
      was removed in a later competitive-UX redesign pass (see
      docs/design-system.md's "Removed tabs and components") -- this seed
      is kept, unused by the dashboard for now, in case a future pass
      wants to reintroduce archetype context elsewhere (e.g. a Team
      Builder tag). Unlike every other seed in this file, this is NOT
      derived from any extractor or external source -- it's editorial
      curation by this dashboard's maintainers, naming known competitive
      strategies/team-compositions (e.g. "Rain", "Trick Room", "Sun") and
      listing the Pokémon commonly associated with each, an explicit and
      deliberate exception to this repo's "provenance is mandatory"
      convention (CLAUDE.md), justified because no in-scope source
      publishes team-composition/archetype labels at all
      (dbt/models/marts/schema.yml's filter-dimension coverage block). The
      dashboard must present archetype data as curated judgment, not as an
      extracted signal.

      **Every member must actually appear in this dataset's Champions
      pool** -- i.e. resolve to a row in
      `releases/data/<version>/pokemon_stat_champions.csv`, not just be a
      real Pokémon in general. A 2026-07 audit found 17 of ~28 rows named
      Pokémon (e.g. Flutter Mane, Iron Hands, Chien-Pao) that were never
      captured by this project's OP.GG extraction at all -- not banned,
      simply never in scope -- apparently authored from general
      real-world VGC knowledge rather than this project's actual roster;
      those rows were removed rather than replaced with guessed
      substitutes, since inventing membership would itself violate the
      provenance exception's spirit (curated judgment about real
      candidates, not fabricated ones). Check any new entry against a
      current `pokemon_stat_champions.csv` before adding it.

      Many-to-many by design: a Pokémon may belong to more than one
      archetype, reflecting real team-building flexibility. Maintained by
      hand -- to add, remove, or retire an archetype as the meta shifts,
      edit this CSV directly; no other pipeline step regenerates it. One
      row per (archetype_key, pokemon_key) pair; duplicate pairs are a
      seed-authoring error, not intentional, and are caught by
      dbt/tests/singular/assert_duplicate_key_archetype_pokemon_map.sql.
    columns:
      - name: archetype_key
        description: Archetype slug (e.g. "trick-room"), stable identifier.
      - name: archetype_name
        description: Archetype display name (e.g. "Trick Room").
      - name: pokemon_key
        description: A member Pokémon's pokemon_key, must resolve to pokemon.

  - name: pokebase_slug_to_pokeapi_form
    description: >
      Controlled name/form mapping from every distinct `form_name` (slug)
      value in stg_pokebase to PokéAPI's `form_name` slug. PokéBase's own
      slug convention already matches PokéAPI's directly for the large
      majority of entries (e.g. `charizard-mega-x`), so most rows here are
      an identity mapping confirmed against PokéAPI's live list; 8 more are
      the same "bare species with no default-equals-species-name PokéAPI
      form" gap solved for OP.GG/MunchStats, resolved via PokéAPI's
      `is_default: true` variety per species (e.g. "gourgeist" ->
      "gourgeist-average"). Four keys were left out rather than guessed or
      double-counted: "meowstic-mega" (ambiguous between
      `meowstic-male-mega`/`meowstic-female-mega`), "tauros-paldea"
      (ambiguous between the three Paldean Tauros breed forms), and
      "aegislash"/"lycanroc" (unlike the other bare-species cases,
      PokéBase separately lists their default sub-form directly —
      `aegislash-shield`, `lycanroc-midday` — as its own entry, so mapping
      the bare name too would map two distinct PokéBase rows onto the same
      pokemon_key).
    columns:
      - name: pokebase_slug
        description: stg_pokebase.form_name value.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.
  - name: limitless_slug_to_pokeapi_form
    description: >
      Controlled slug/form mapping from every `pokemon_slug` in
      stg_limitless to PokéAPI's `form_name`. Limitless follows PokéAPI's
      own form-naming convention closely, so this is mostly an identity
      map: of the 83 distinct slugs seen in real Champions team lists, 78
      match a PokéAPI form_name outright.

      The five that don't (aegislash, basculegion, maushold, mimikyu,
      palafin) are species whose PokéAPI entry has no bare-species variety,
      only explicit ones. Each resolves to the same default battle form
      munchstats_name_to_pokeapi_form.csv already picks for the identical
      case (aegislash-shield, basculegion-male, maushold-family-of-four,
      mimikyu-disguised, palafin-zero), rather than introducing a second
      convention for the same question.

      Known limitation, surfaced by roster_source_agreement: Limitless
      publishes a bare "maushold" slug with no family-size distinction, so
      the three real Maushold-Family-of-Three teams MunchStats reports are
      mapped here to family-of-four. That is a genuine ambiguity in the
      upstream data, not a resolvable mapping — it is left visible in the
      agreement mart rather than special-cased away.
    columns:
      - name: limitless_pokemon_slug
        description: stg_limitless.pokemon_slug value.
      - name: pokeapi_form_name
        description: The matching form_name in stg_pokeapi/pokemon.
  - name: limitless_mega_item_to_pokeapi_form
    description: >
      Resolves a Limitless roster slot to its Mega-evolved form, keyed on
      (species slug, held item). Limitless publishes the *base* species
      holding its Mega Stone ("Charizard" + "Charizardite Y") where
      MunchStats publishes the evolved form ("Charizard-Mega-Y"). Both
      describe the same team, but the Limitless reading taken literally
      joins to base-species stats, which are not the stats that Pokémon
      played with — so this seed is a correctness fix, not a display
      convenience.

      Keyed on the item as well as the slug because the item is what
      actually determines the outcome: the same species holding a Focus
      Sash stays in its base form, and Charizard's two Megas are told apart
      by the stone's own X/Y suffix. Built by matching every observed
      (slug, item) pair against PokéAPI's real `<slug>-mega*` forms, with
      two cases the mechanical rule could not derive: "Eviolite" is
      excluded explicitly (a generic item that ends in -ite and would
      otherwise read as a Mega Stone), and Floette's Mega evolves from the
      Eternal Flower form onto `floette-mega` rather than a
      `floette-eternal-mega` that does not exist.

      This mapping was found empirically, not anticipated:
      roster_source_agreement reported 0% exact cross-source agreement
      until it was applied, and 97.9-100% afterwards.
    columns:
      - name: limitless_pokemon_slug
        description: stg_limitless.pokemon_slug value (the base species).
      - name: item_name
        description: The Mega Stone held in that slot, as Limitless prints it.
      - name: pokeapi_form_name
        description: The Mega form's form_name in stg_pokeapi/pokemon.
