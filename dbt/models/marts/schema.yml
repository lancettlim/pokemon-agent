version: 2

models:
  - name: pokemon_usage_summary
    description: >
      Total tournament-roster usage per Pokémon (restricted to the current
      legal pool), ranked descending, with an event_tier filter dimension:
      one overall row per Pokémon (event_tier is null) plus one row per
      tournament tier it appears in, each ranked within its own event_tier
      partition. Written to data/marts/pokemon_usage_summary.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'event_tier']
          config:
            meta: {category: mart_quality, table_name: pokemon_usage_summary}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_summary}
  - name: legality_summary_by_regulation
    description: >
      Legal-pool size per regulation and snapshot_date: legal_pokemon_count
      (this regulation only) and cumulative_legal_pokemon_count (a naive
      union of every regulation_code <= this one, within the same
      snapshot_date). CAVEAT: PokéBase (legality_snapshot's sole source)
      publishes no removal signal, so cumulative_legal_pokemon_count can
      only grow across regulations -- it will keep counting a Pokémon that
      was actually banned in a later regulation, since there's no event to
      subtract it back out. Written to
      data/marts/legality_summary_by_regulation.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_code', 'snapshot_date']
          config:
            meta: {category: mart_quality, table_name: legality_summary_by_regulation}
    columns:
      - name: regulation_code
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: legality_summary_by_regulation}
      - name: snapshot_date
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: legality_summary_by_regulation}
  - name: stat_change_leaderboard
    description: >
      pokemon_stat_delta reshaped with a gainer/loser direction flag and a
      rank within that direction. Written to
      data/marts/stat_change_leaderboard.csv.
    columns:
      - name: pokemon_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: stat_change_leaderboard}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: stat_change_leaderboard}
  - name: pokemon_win_rate_summary
    description: >
      Win-rate-proxy KPI per Pokémon: total wins/losses and win_rate
      aggregated from tournament_team's reported record_wins/record_losses
      across every roster slot that included the Pokémon, restricted to
      the current legal pool and to teams with a reported record.
      wilson_lower_bound/wilson_rank (backlog.md #13) are a 95% Wilson
      score confidence interval lower bound and its rank, which order
      small-sample win rates more honestly than raw win_rate does (a 100%
      win rate over 3 matches no longer outranks 62% over 200). Written
      to data/marts/pokemon_win_rate_summary.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_win_rate_summary}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_win_rate_summary}
  - name: pokemon_item_usage
    description: >
      Item drill-down for the Pokémon Profile tab's Items section (top 5
      shown in the dashboard UI): usage count and item_share (that count's
      fraction of the Pokémon's own total item rows) per Pokémon x item,
      restricted to the current legal pool, ranked within each Pokémon,
      with short_effect joined from item_detail. Written to
      data/marts/pokemon_item_usage.csv. Replaces the old combined
      pokemon_build_usage mart (see pokemon_ability_usage below for the
      other half of that split).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'item_name']
          config:
            meta: {category: mart_quality, table_name: pokemon_item_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_item_usage}
      - name: item_name
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_item_usage}
  - name: pokemon_ability_usage
    description: >
      Ability drill-down for the Pokémon Profile tab's Ability section:
      usage count and ability_share (that count's fraction of the
      Pokémon's own total ability rows) per Pokémon x ability, restricted
      to the current legal pool, ranked within each Pokémon, with
      short_effect joined from ability_detail. Written to
      data/marts/pokemon_ability_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'ability']
          config:
            meta: {category: mart_quality, table_name: pokemon_ability_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_ability_usage}
      - name: ability
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_ability_usage}
  - name: pokemon_nature_usage
    description: >
      Nature drill-down per Pokémon x nature (usage_count, nature_share,
      usage_rank within the Pokémon), restricted to the current legal pool
      and partitioned by regulation_scope. Feeds the Pokémon Profile's
      most-common-set card. Written to data/marts/pokemon_nature_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'nature']
          config:
            meta: {category: mart_quality, table_name: pokemon_nature_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_nature_usage}
  - name: pokemon_move_usage
    description: >
      Move drill-down for the Pokémon Profile tab's Moves section (top 15
      shown in the dashboard UI) and the Matchup tab's damage calculator:
      usage count and move_share (that count's fraction of the Pokémon's
      own total move rows) per Pokémon x move, unnesting
      tournament_team_member's pipe-delimited moves list, restricted to
      the current legal pool, ranked within each Pokémon, with
      move_type/power/accuracy/category/priority/pp/short_effect joined
      from move_detail. Written to data/marts/pokemon_move_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'move_name']
          config:
            meta: {category: mart_quality, table_name: pokemon_move_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_move_usage}
      - name: move_name
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_move_usage}
  - name: top_tournament_teams
    description: >
      Top Teams tab's leaderboard feed: one row per tournament_team with a
      reported win/loss record, ranked by win_rate, with event context and
      full member roster (pokemon_keys, pipe-delimited in slot order).
      Written to data/marts/top_tournament_teams.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'team_id']
          config:
            meta: {category: mart_quality, table_name: top_tournament_teams}
    columns:
      - name: team_id
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: top_tournament_teams}
  - name: team_list_convergence
    description: >
      Top Teams tab's "Converged lists" feed: one row per canonical
      Limitless team-list id, ranked by how many distinct players fielded
      that same six-Pokémon composition (player_count), with
      tournament_count, best_placement, first_seen_date and the full
      roster (pokemon_keys, pipe-delimited in slot order). Surfaces the
      team_list/team_list_member layer, which no other mart reads.
      Scoping note: Limitless is a Champions-only source and this mart's
      grain is team_list_member, so it does not (and cannot) route through
      int_champions_roster — see the model header. Coverage caveat:
      Limitless publishes the day-2 cut only (~93 distinct Pokémon against
      203 in the full Champions roster), so this describes what converged
      at the top of the field, not the meta. Written to
      data/marts/team_list_convergence.csv.
    columns:
      - name: team_list_id
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: team_list_convergence}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: team_list_convergence}
  - name: pokemon_team_core_usage
    description: >
      Team-core drill-down (docs/prd.md's "Drill-down by Pokémon, team
      core, move, and item usage"): co-occurrence usage count and
      partner_share (that count's fraction of the Pokémon's own total
      co-occurrence count across all partners) per Pokémon x partner
      Pokémon pair appearing on the same tournament team, restricted to
      the current legal pool, ranked within each anchor Pokémon by
      co-occurrence count. Symmetric: each unordered pair appears twice
      (once per anchor direction) so either Pokémon in the pair can be the
      drill-down's selected anchor. Written to
      data/marts/pokemon_team_core_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'partner_pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_team_core_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_core_usage}
      - name: partner_pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_core_usage}
  - name: pokemon_archetype_usage
    description: >
      Archetype Explorer member-level drill-down: joins the curated,
      NOT-sourced dbt/seeds/archetype_pokemon_map.csv seed to real
      usage/win-rate data, ranked within each archetype by usage_share.
      usage_share/win_rate/record_count are nullable -- a curated member
      may have no recorded tournament appearances yet. Written to
      data/marts/pokemon_archetype_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['archetype_key', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_archetype_usage}
    columns:
      - name: archetype_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_archetype_usage}
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_archetype_usage}
  - name: archetype_summary
    description: >
      Archetype Explorer card-grid feed: one row per curated archetype
      with member_count, combined_usage_share (sum of members'
      usage_share), avg_win_rate, and top_member_pokemon_key (the #1
      member by usage_share). Built on top of the curated, NOT-sourced
      archetype_pokemon_map seed -- see that seed's schema.yml entry for
      why this is an explicit exception to the provenance-is-mandatory
      convention. Written to data/marts/archetype_summary.csv.
    columns:
      - name: archetype_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: archetype_summary}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: archetype_summary}
  - name: pokemon_champions_profile
    description: >
      Denormalized per-Pokémon profile for the Speed Tiers and Team
      Builder dashboard views: one row per currently legal Pokémon with
      its Champions-format base stats (including speed) plus nullable
      overall usage_count/usage_share/win_rate/record_count.
      max_investment_speed (backlog.md #16) is the Level-50 Speed stat
      under the standard "max speed investment" competitive convention
      (252 EVs, a beneficial nature, 31 IV) rather than raw base speed --
      see pokemon_speed_tiers below for the full modified-speed bracket
      table built on top of it. Written to
      data/marts/pokemon_champions_profile.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_champions_profile}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_champions_profile}
  - name: pokemon_usage_by_regulation
    description: >
      Usage x regulation cross-tab (backlog.md #12): every Pokémon legal
      under each regulation (legality_snapshot at the latest snapshot_date)
      with its usage in events played under that regulation, 0 if unused.
      usage_share/usage_rank are computed within each regulation_code. A
      true temporal slice since tournament_event gained regulation_code
      (docs/upgrade-plan-2026q4.md, A2). Written to
      data/marts/pokemon_usage_by_regulation.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_code', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_usage_by_regulation}
    columns:
      - name: regulation_code
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_regulation}
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_regulation}
  - name: pokemon_regulation_movers
    description: >
      Regulation-to-regulation "what changed" feed: per Pokémon, usage
      share/rank and win rate in a regulation beside the regulation before
      it (consecutive pairs from the champions_regulations seed), with
      deltas, an is_new_to_format flag (not legal in the previous
      regulation) and both regulations' team counts as sample size. Needs
      no extraction-snapshot history (docs/upgrade-plan-2026q4.md, A4).
      Written to data/marts/pokemon_regulation_movers.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_code', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_regulation_movers}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_regulation_movers}
      - name: regulation_code
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_regulation_movers}
  - name: pokemon_build_concentration
    description: >
      Item and ability build concentration (backlog.md #14): a
      Herfindahl-Hirschman Index (sum of squared shares) over
      pokemon_item_usage.item_share and pokemon_ability_usage.ability_share
      per Pokémon -- HHI near 1 means usage is concentrated on a single
      locked-in item/ability, near 0 means usage is spread across several
      contested choices. item_count/ability_count is how many distinct
      items/abilities were observed at all. Written to
      data/marts/pokemon_build_concentration.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_build_concentration}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_build_concentration}
  - name: pokemon_placement_weighted_usage
    description: >
      Placement-weighted usage (backlog.md #8): distinguishes "popular"
      from "successful" using tournament_team.placement (lower is better).
      top_cut_usage_count/top_cut_usage_share use a hard top-8 cutoff;
      placement_weighted_score/weighted_usage_share use a continuous
      inverse-placement (1/placement) weight per appearance instead.
      Written to data/marts/pokemon_placement_weighted_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_placement_weighted_usage}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_placement_weighted_usage}
  - name: pokemon_usage_by_event_date
    description: >
      Usage over time from tournament_event.event_date (backlog.md #6):
      usage count/share/rank per Pokémon x event_date, partitioned by
      event_date -- a real meta-over-time view that doesn't need multiple
      extraction snapshots (Blocker A), since it trends across tournaments
      actually played instead of across re-extraction dates. Written to
      data/marts/pokemon_usage_by_event_date.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['pokemon_key', 'event_date']
          config:
            meta: {category: mart_quality, table_name: pokemon_usage_by_event_date}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_event_date}
      - name: event_date
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_event_date}
  - name: pokemon_team_synergy
    description: >
      Team synergy beyond raw co-occurrence (backlog.md #9): lift per
      Pokémon x partner Pokémon pair -- the ratio of a pair's observed
      team co-occurrence rate to the rate expected if the two Pokémon
      were paired independently of their individual popularity. lift > 1
      is a genuine pairing; lift < 1 is paired less than chance. Built on
      top of pokemon_team_core_usage's mirrored pairs. pair_team_count is
      exposed alongside lift since lift is noisy at low pair counts.
      Written to data/marts/pokemon_team_synergy.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'partner_pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_team_synergy}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_synergy}
      - name: partner_pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_synergy}
  - name: pokemon_team_core_triple_usage
    description: >
      Canonical three-Pokemon Champions team cores. Each row is one
      pokemon_key_a < pokemon_key_b < pokemon_key_c triple with distinct
      team/player/event support, observed and expected team share,
      three-way lift, constituent pair-lift summaries, placement/win-rate
      context, and support/lift ranks. Written to
      data/marts/pokemon_team_core_triple_usage.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['pokemon_key_a', 'pokemon_key_b', 'pokemon_key_c']
          config:
            meta: {category: mart_quality, table_name: pokemon_team_core_triple_usage}
    columns:
      - name: pokemon_key_a
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_core_triple_usage}
      - name: pokemon_key_b
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_core_triple_usage}
      - name: pokemon_key_c
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_team_core_triple_usage}
  - name: detected_archetype_candidates
    description: >
      Experimental data-derived archetype cores. Qualifying triples have
      at least five teams and above-chance triple/average-pair lift;
      candidates sharing two Pokemon consolidate under their strongest
      one-hop neighbour. Written to
      data/marts/detected_archetype_candidates.csv.
    columns:
      - name: candidate_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_candidates}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_candidates}
      - name: archetype_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_candidates}
  - name: detected_archetype_team_membership
    description: >
      Experimental team assignments to detected archetypes. Every matched
      team has one primary assignment; a secondary assignment is retained
      only when its score is within 90% of the primary score. Written to
      data/marts/detected_archetype_team_membership.csv.
    columns:
      - name: archetype_assignment_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_team_membership}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_team_membership}
      - name: team_id
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_team_membership}
      - name: archetype_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_team_membership}
  - name: detected_archetype_summary
    description: >
      Dashboard-facing experimental archetype summary using primary team
      assignments only: representative core, usage/player/event support,
      placement and win-rate context, top extension, and a simple stability
      label. Neutral core names are intentional; editorial labels are not
      inferred from composition alone. Written to
      data/marts/detected_archetype_summary.csv.
    columns:
      - name: archetype_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_summary}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: detected_archetype_summary}
  - name: pokemon_usage_by_country
    description: >
      Country-grain half of backlog.md #7 ("which regions favor which
      archetypes"): usage x player_country cross-tab, restricted to the
      current legal pool and to roster rows with a reported
      player_country (optional in the source). usage_share/
      country_usage_rank are computed within each player_country
      partition, mirroring pokemon_usage_by_regulation's usage-x-dimension
      pattern. Written to data/marts/pokemon_usage_by_country.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['pokemon_key', 'player_country']
          config:
            meta: {category: mart_quality, table_name: pokemon_usage_by_country}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_country}
      - name: player_country
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_usage_by_country}
  - name: pokemon_speed_tiers
    description: >
      Speed-tier bracket mart (backlog.md #16): modified Speed under the
      format's common competitive scenarios, built on top of
      pokemon_champions_profile.max_investment_speed. plus_one_speed/
      scarf_speed (x1.5) and plus_two_speed/tailwind_speed (x2.0) are
      numerically identical pairs kept as separately-named columns since
      they answer different real questions (a stat-stage boost vs. an
      item vs. a team-wide field effect); scarf_tailwind_speed (x3.0)
      covers the common scarfed-Pokémon-under-Tailwind combination. The
      multipliers themselves are fixed game-mechanics constants, the same
      treatment already given to app.js's SPEED_TIERS thresholds and
      matchup.js's TYPE_CHART. Written to
      data/marts/pokemon_speed_tiers.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_speed_tiers}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_speed_tiers}
  - name: player_signature_pokemon
    description: >
      Player-grain half of backlog.md #7 ("does this player have a
      signature Pokémon," across their full history): one row per
      player_id x pokemon_key they've fielded, restricted to the current
      legal pool. player_usage_share is this Pokémon's fraction of the
      player's own total legal-pool roster appearances across every team
      of theirs on record; player_pokemon_rank 1 is their most-played
      Pokémon. player_team_count (distinct teams this player has fielded)
      is a sample-size signal alongside the rank. Written to
      data/marts/player_signature_pokemon.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['player_id', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: player_signature_pokemon}
    columns:
      - name: player_id
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: player_signature_pokemon}
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: player_signature_pokemon}
  - name: roster_source_agreement
    description: >
      Cross-source validation, one row per event covered by both MunchStats
      and Limitless: how often the two independently agree on a player's six
      Pokémon. exact_agreement_rate is whole-roster agreement,
      slot_agreement_rate is per-slot. The event join is real rather than
      heuristic — Limitless links out to the same event on RK9, and
      MunchStats reuses RK9's event ids. covered_players is stated because
      the comparison spans Limitless' day-2 cut, not the full field.
      This mart earned its keep immediately: it reported 0% exact agreement
      on first run, which is what surfaced the Mega representation
      difference now handled by limitless_mega_item_to_pokeapi_form (see
      int_limitless_mapped.sql). Written to
      data/marts/roster_source_agreement.csv.
    columns:
      - name: event_id
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: roster_source_agreement}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: roster_source_agreement}
  - name: pokemon_head_to_head
    description: >
      Real head-to-head records per (pokemon_key, opponent_pokemon_key),
      built on tournament_match (RK9 pairings, backlog.md #27): how often
      teams fielding the first Pokémon beat teams fielding the second,
      with a 95% Wilson lower bound since head-to-head samples are small.
      CAVEAT, and it must be surfaced wherever this is displayed: the grain
      is team vs team, NOT Pokémon vs Pokémon. RK9 publishes no per-battle
      log naming which Pokémon were brought (VGC brings 4 of 6) or which
      defeated which, so a row reads "teams with A beat teams with B this
      often", never "A beats B". Pairs are mirrored, and scoped to Masters,
      to decided matches, and to the current legal pool. Written to
      data/marts/pokemon_head_to_head.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['pokemon_key', 'opponent_pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_head_to_head}
    columns:
      - name: pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_head_to_head}
      - name: opponent_pokemon_key
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_head_to_head}
  - name: pokemon_matchup_summary
    description: >
      One row per Pokémon: overall head-to-head win rate plus its best and
      worst matchups, chosen by Wilson lower bound over a minimum of 10
      matches (a raw win-rate extreme is always a 1-0 record). Inherits
      pokemon_head_to_head's team-vs-team caveat exactly. Written to
      data/marts/pokemon_matchup_summary.csv.
    columns:
      - name: pokemon_key
        data_tests:
          - unique:
              config:
                meta: {category: mart_quality, table_name: pokemon_matchup_summary}
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_matchup_summary}

  - name: tournament_event_summary
    description: >
      One row per Champions event: name, date, tier, regulation, how many
      teams and players it has on record, how many reported a W-L record,
      how many decided Masters matches RK9 published, and the winning
      team. Feeds the event index, each event page's header and the
      events/teams sample-size KPI. Written to
      data/marts/tournament_event_summary.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['event_id']
          config:
            meta: {category: mart_quality, table_name: tournament_event_summary}
    columns:
      - name: event_id
        description: "The event's tournament_event.event_id."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_event_summary}
      - name: regulation_code
        description: "The Champions regulation the event was played under."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_event_summary}
      - name: team_count
        description: "Teams with at least one Champions roster row."
      - name: player_count
        description: "Distinct players with a team at the event."
      - name: recorded_team_count
        description: "Teams that reported a W-L record."
      - name: match_count
        description: "Decided Masters matches in RK9 pairings (0 when RK9 has none)."
      - name: winner_pokemon_keys
        description: "The placement-1 team's Pokémon, pipe-delimited in slot order."
      - name: recency_rank
        description: "1 for the regulation's newest event, counting back."
  - name: tournament_team_results
    description: >
      One row per Champions team: event, player (as the source spells the
      name), placement, W-L record, its six Pokémon, whether the sheet is
      fully reported (six Pokémon, each with item, ability, nature and four
      moves) and its primary detected archetype. Feeds event pages, Top
      Teams' placement ranking, player pages and a profile's "Teams
      featuring" list. Written to data/marts/tournament_team_results.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['team_id']
          config:
            meta: {category: mart_quality, table_name: tournament_team_results}
    columns:
      - name: team_id
        description: "The team's tournament_team.team_id."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_team_results}
      - name: event_id
        description: "The event the team was brought to."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_team_results}
      - name: placement
        description: "Final standing at the event; null when unpublished."
      - name: event_team_count
        description: "Teams on record at the same event, the placement's denominator."
      - name: win_rate
        description: "record_wins / (record_wins + record_losses); null without a record."
      - name: pokemon_keys
        description: "The team's Pokémon, pipe-delimited in slot order."
      - name: is_fully_reported
        description: "Six Pokémon, each with an item, ability, nature and four moves."
      - name: primary_archetype_key
        description: "Primary detected_archetype_team_membership assignment, if any."
  - name: tournament_team_sheets
    description: >
      Full team sheets (item, ability, nature, moves per slot) for every
      top-16 finish at a Champions event and every team on the
      top_tournament_teams leaderboard: the teams a reader can copy for
      Showdown or load into the Builder. One row per team x slot. No EV or
      IV columns: team sheets don't publish them. Written to
      data/marts/tournament_team_sheets.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['team_id', 'slot_number']
          config:
            meta: {category: mart_quality, table_name: tournament_team_sheets}
    columns:
      - name: team_id
        description: "The team's tournament_team.team_id."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_team_sheets}
      - name: pokemon_key
        description: "The Pokémon in this slot."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: tournament_team_sheets}
      - name: moves
        description: "Up to four moves, pipe-delimited as the sheet lists them."
  - name: team_list_sheets
    description: >
      Full sheets (item, ability, nature, moves per slot) for the 60 most
      converged Limitless team lists, so Top Teams' "Use this team" loads a
      converged list into the Builder with real sets. One row per list x
      slot. Written to data/marts/team_list_sheets.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['team_list_id', 'slot_number']
          config:
            meta: {category: mart_quality, table_name: team_list_sheets}
    columns:
      - name: team_list_id
        description: "The Limitless team list."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: team_list_sheets}
  - name: pokemon_set_variants
    description: >
      Real sets per Pokémon: the item, ability, nature and four moves that
      appeared together on one team sheet (set_level 'full'), plus a looser
      'core' level grouping item + ability + the set's three most common
      moves. Top 5 per Pokémon, regulation scope and level, ranked by
      team_count then Wilson lower bound. share_of_pokemon divides by all of
      the Pokémon's roster slots, so shares sum to at most 1. Written to
      data/marts/pokemon_set_variants.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['regulation_scope', 'pokemon_key', 'set_level', 'set_rank']
          config:
            meta: {category: mart_quality, table_name: pokemon_set_variants}
    columns:
      - name: pokemon_key
        description: "The Pokémon running the set."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_set_variants}
      - name: set_level
        description: "'full' (exact set) or 'core' (item + ability + top 3 moves)."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_set_variants}
      - name: moves
        description: "Pipe-delimited, sorted alphabetically: four for 'full', three for 'core'."
      - name: team_count
        description: "Roster slots (one per team) that ran the set."
      - name: share_of_pokemon
        description: "team_count / every roster slot of the Pokémon in the scope."
      - name: wilson_lower_bound
        description: "95% Wilson lower bound on the teams' combined win rate."
      - name: example_team_id
        description: "One team that ran the set verbatim."
  - name: pokemon_event_usage_vs_regulation
    description: >
      Usage of each Pokémon at each Champions event against its
      regulation's average (share of roster slots), including Pokémon
      absent from the event. Feeds an event page's over- and
      under-performers and the event-window filter. Written to
      data/marts/pokemon_event_usage_vs_regulation.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['event_id', 'pokemon_key']
          config:
            meta: {category: mart_quality, table_name: pokemon_event_usage_vs_regulation}
    columns:
      - name: event_id
        description: "The event."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_event_usage_vs_regulation}
      - name: pokemon_key
        description: "The Pokémon."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: pokemon_event_usage_vs_regulation}
      - name: event_usage_share
        description: "usage_count / event_slot_count."
      - name: regulation_usage_share
        description: "The Pokémon's usage share across the whole regulation."
      - name: usage_share_delta
        description: "event_usage_share - regulation_usage_share."
  - name: player_archetype_record
    description: >
      A player's team-vs-team record against each detected archetype they
      faced, per regulation_scope (each regulation plus 'all'), from decided
      Masters matches; rows with fewer than 2 matches in their scope are
      dropped. Written to data/marts/player_archetype_record.csv.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['player_id', 'regulation_scope', 'opponent_archetype_key']
          config:
            meta: {category: mart_quality, table_name: player_archetype_record}
    columns:
      - name: player_id
        description: "The player."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: player_archetype_record}
      - name: regulation_scope
        description: "A regulation code, or 'all' for every Champions regulation together."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: player_archetype_record}
      - name: opponent_archetype_key
        description: "The opponent team's primary archetype."
        data_tests:
          - not_null:
              config:
                meta: {category: mart_quality, table_name: player_archetype_record}
      - name: matches_played
        description: "Decided matches against teams of that archetype."

# Filter-dimension coverage for docs/todo.md's "Document KPI views and
# filter dimensions (regulation/date/tournament tier)" item, and how it
# maps to docs/prd.md's fuller dashboard-analytics ambition:
#
# Available now, with current data:
#   - regulation: legality_snapshot.regulation_code / legality_summary_by_regulation
#   - date: tournament_event.event_date, legality_snapshot.snapshot_date
#   - Pokémon drill-down: pokemon_key across every mart and core entity
#   - tournament tier: tournament_event.event_tier / pokemon_usage_summary's
#     event_tier dimension
#   - win-rate proxies: pokemon_win_rate_summary, built from
#     tournament_team.record_wins/record_losses
#   - move/item/ability drill-down: pokemon_item_usage, pokemon_ability_usage,
#     and pokemon_move_usage, each with descriptive text joined from
#     move_detail/ability_detail/item_detail (PokéAPI effect text)
#   - team-core drill-down: pokemon_team_core_usage, self-joining
#     tournament_team_member on team_id
#   - top real tournament teams: top_tournament_teams, ranked by win_rate
#     with full member rosters
#   - usage as a percentage of the meta: pokemon_usage_summary.usage_share
#   - speed tiers / team builder: pokemon_champions_profile, one row per
#     legal Pokémon with Champions-format speed plus usage/win-rate
#   - cumulative legal pool by regulation:
#     legality_summary_by_regulation.cumulative_legal_pokemon_count (naive
#     union across regulation_codes <= the current one) -- CAVEAT: no
#     removal signal in the source, so this count can only grow, repeated
#     here for discoverability alongside that model's own schema.yml entry
#   - competitive archetype/team-composition drill-down:
#     pokemon_archetype_usage / archetype_summary, built from a CURATED
#     seed (dbt/seeds/archetype_pokemon_map.csv) joined against real
#     usage/win-rate data -- must be presented in the dashboard as
#     editorial judgment, not as an extracted/sourced fact
#
# Type-effectiveness is now closed for the type-per-Pokémon half: pokemon
# (and pokemon_champions_profile) carry type_1/type_2 from PokéAPI, and
# move_detail carries each move's type/power/accuracy/category, so the
# dashboard's Matchup tab can compute real type effectiveness and a
# stats/setup/weather-aware damage calculator client-side (the type chart
# and weather-boost multipliers are universal game-mechanics constants, not
# per-record data, and live in the dashboard's JS layer rather than a dbt
# model — the same treatment already given to app.js's SPEED_TIERS
# bucketing constant).
#
# The head-to-head half is now largely closed too, and the note that used
# to sit here ("MunchStats reports team-level win/loss records, not
# individual battle outcomes against a named opponent") was only ever true
# of MunchStats: RK9 — the tournament software MunchStats itself scrapes —
# publishes round-by-round pairings with a winner per match. Those land as
# tournament_match and feed pokemon_head_to_head /
# pokemon_matchup_summary, so "what beats Pokémon X in practice" now has a
# real, sourced answer (backlog.md #27). The Matchup tab's co-usage panel
# (pokemon_team_core_usage) remains a teammate-pairing view, and is no
# longer standing in for a matchup signal that doesn't exist.
#
# What is still genuinely missing is narrower: per-battle, per-Pokémon
# outcomes. No source names which 4 of a team's 6 Pokémon were actually
# brought to a given match, or which Pokémon knocked out which, so every
# head-to-head number here is attributed to the whole roster. Closing that
# would need a battle-log/replay source, which no in-scope or deferred
# source provides.
#
# All fields these depend on (event_tier, record_wins/record_losses,
# item_name/ability/tera_type/moves) are optional in the source data — see
# docs/dataset-spec.md's tournament_event/tournament_team/
# tournament_team_member "Optional fields" — so these marts only cover the
# subset of tournaments/rosters MunchStats actually reported them for.
#
# Mart tests (backlog.md #42): every model above now carries a
# unique_combination_of_columns (or built-in unique, for a single-column
# grain) plus not_null on its grain columns, tagged meta.category:
# mart_quality so pipelines/validate/report.py buckets them into their own
# schema_drift_checks-style report section -- but, unlike every other
# category, mart_quality_checks is deliberately NOT folded into
# release_blocking_findings: marts branch off the normalized layer for
# dashboard-facing output and aren't part of the release package (see
# CLAUDE.md's "Repository structure"), so a mart-quality failure should be
# visible and actionable without blocking `pipelines.cli release`.
