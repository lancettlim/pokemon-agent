version: 2

models:
  - name: pokemon
    description: "Canonical identity table for Pokémon and form references. See data/normalized/pokemon.schema.json."
  - name: pokemon_stat_canonical
    description: "Canonical PokéAPI stat snapshot. See data/normalized/pokemon_stat_canonical.schema.json."
  - name: pokemon_stat_champions
    description: "Champions-format stat snapshot from OP.GG. See data/normalized/pokemon_stat_champions.schema.json."
  - name: pokemon_stat_delta
    description: "Derived canonical-vs-Champions stat change output. See data/normalized/pokemon_stat_delta.schema.json."
  - name: legality_snapshot
    description: "Time-sliced legal status for the Champions pool. See data/normalized/legality_snapshot.schema.json."
  - name: tournament_event
    description: "Normalized tournament metadata: official events from MunchStats, and Limitless online tournaments as their own population (event_tier 'Online'). See data/normalized/tournament_event.schema.json."
  - name: tournament_team
    description: "Team-level tournament metadata. See data/normalized/tournament_team.schema.json."
  - name: tournament_team_member
    description: "One row per Pokémon on a normalized tournament team. See data/normalized/tournament_team_member.schema.json."
  - name: tournament_match
    description: "One row per played match: who faced whom, in which round, and who won, sourced from RK9 pairings (official events) and Limitless pairings (online tournaments, division 'Online'). Grain is team vs team, not Pokémon vs Pokémon — no source publishes a per-battle Pokémon-level log. See data/normalized/tournament_match.schema.json."
  - name: team_list
    description: "One row per canonical Limitless team-list id: a team composition identity reused across the players and events that fielded it. Covers the day-2 cut only. See data/normalized/team_list.schema.json."
  - name: team_list_member
    description: "One row per Pokémon on a canonical team list, with held item, ability, nature and moves. No EV/IV spread: official team sheets do not publish one. See data/normalized/team_list_member.schema.json."
  - name: pokemon_asset
    description: "Image manifest for Pokémon/form references. One row per pokemon_key per image_kind: 128x128 menu_sprite from Bulbagarden Archives (the dense-UI asset) and 512x512 home_render from PokéAPI's sprite repository (the hero asset). Primary key is the composite pokemon_asset_key (<pokemon_key>::<image_kind>) — pokemon_key alone is deliberately non-unique. See data/normalized/pokemon_asset.schema.json."
  - name: move_detail
    description: "Move reference detail (type/power/accuracy/category/priority/pp/short_effect), scoped to moves seen in tournament rosters. Dashboard-support reference data, not a release-gated core entity. See data/normalized/move_detail.schema.json."
  - name: ability_detail
    description: "Ability reference detail (short_effect), scoped to abilities seen in tournament rosters. Dashboard-support reference data, not a release-gated core entity. See data/normalized/ability_detail.schema.json."
  - name: item_detail
    description: "Held-item reference detail (short_effect), scoped to items seen in tournament rosters. Dashboard-support reference data, not a release-gated core entity. See data/normalized/item_detail.schema.json."
