version: 2

sources:
  - name: staging
    meta:
      # Each table now reads every retained date-partitioned snapshot under
      # its own data/staging/<name>/ subdirectory (pipelines/cli.py writes
      # one CSV per UTC extraction day there, per backlog.md #1) rather than
      # a single overwritten file — DuckDB's CSV reader unions all matches
      # of the glob. stg_*.sql models expose the full unioned history with a
      # snapshot_date column; int_*_latest.sql models select the current
      # point-in-time snapshot for the rest of the normalized layer to
      # build on (backlog.md #2).
      #
      # quote/escape are pinned for the same reason dbt_project.yml pins
      # them on the normalized/mart layers: DuckDB's sniffer only samples
      # the first ~20k rows, and a quoted comma further down (the 2026-10
      # MunchStats snapshot's first appears at line 24,762: "CHIA,HAN LIN")
      # gets the file mis-detected as unquoted. union_by_name keeps the
      # multi-snapshot glob readable across a staging column being added.
      external_location: "read_csv('../data/staging/{name}/*.csv', auto_detect=true, header=true, quote='\"', escape='\"', union_by_name=true)"
    tables:
      # backlog.md #39: freshness thresholds mirror docs/dataset-spec.md's
      # "Refresh policy" cadences (PokéAPI weekly, everything else daily),
      # doubled for warn_after/error_after so one missed scheduled run warns
      # rather than errors -- error_after is meant to catch a genuinely
      # stalled pipeline, not routine schedule jitter. loaded_at_field casts
      # extracted_at_utc (a plain ISO-8601 string column, per
      # data/staging/*.schema.json) to a timestamp, since dbt's freshness
      # macro needs a real datetime value, not a string, to diff against
      # the current time. Bulbagarden has no freshness block: it's
      # deliberately on-demand-only (pipelines/extract/bulbagarden.py's
      # docstring), not on a schedule a staleness threshold could measure
      # against. row_count_anomaly (backlog #40, dbt/macros/
      # test_row_count_anomaly.sql) compares each table's latest
      # snapshot_date row count against its immediately preceding one and
      # fails below 50% of that baseline -- a volume-drop check that #36's
      # zero-row gate can't see. Same seven scheduled sources as
      # freshness; Bulbagarden stays exempt for the same on-demand reason.
      - name: pokeapi
        description: "Raw PokéAPI identity + base stat rows. See data/staging/pokeapi.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 21, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: pokeapi}
      - name: pokeapi_move
        description: "Raw PokéAPI move detail rows, scoped to moves seen in tournament rosters. See data/staging/pokeapi_move.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 21, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: pokeapi_move}
      - name: pokeapi_ability
        description: "Raw PokéAPI ability effect-text rows, scoped to abilities seen in tournament rosters. See data/staging/pokeapi_ability.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 21, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: pokeapi_ability}
      - name: pokeapi_item
        description: "Raw PokéAPI held-item effect-text rows, scoped to items seen in tournament rosters. See data/staging/pokeapi_item.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 21, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: pokeapi_item}
      - name: opgg_champions
        description: "Raw OP.GG Pokémon Champions legal pool + rebalanced stats. See data/staging/opgg_champions.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: opgg_champions}
      - name: munchstats
        description: "Raw MunchStats tournament/team/roster rows. See data/staging/munchstats.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: munchstats}
      - name: rk9_pairings
        description: "Raw RK9 round-by-round tournament pairings and match outcomes. See data/staging/rk9_pairings.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: rk9_pairings}
      - name: limitless
        description: "Raw Limitless VGC canonical team lists per tournament/player. See data/staging/limitless.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: limitless}
      - name: pokebase
        description: "Raw PokéBase per-regulation Champions legal-pool membership. See data/staging/pokebase.schema.json."
        loaded_at_field: "CAST(extracted_at_utc AS TIMESTAMP)"
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        data_tests:
          - row_count_anomaly:
              config:
                meta: {category: row_count_anomaly, source_name: pokebase}
      # Exempt from freshness/row_count_anomaly for the same reason
      # Bulbagarden is: artwork extraction is on-demand-only, scoped to the
      # forms Bulbagarden already covers, so there is no cadence a staleness
      # threshold could measure against and no expected per-run volume
      # drift to alarm on.
      - name: pokeapi_artwork
        description: "Raw PokéAPI high-resolution HOME render manifest, scoped to forms with a Champions menu sprite. See data/staging/pokeapi_artwork.schema.json."
      - name: bulbagarden
        description: "Raw Bulbagarden Champions-menu-sprite image manifest. See data/staging/bulbagarden.schema.json."
