name: CI

# backlog.md #35: `make check` (lint + test + dbt build + validate) existed
# but nothing ran it automatically -- this is the first workflow to do so.
#
# lint/test are pure Python and always run: no network, no dependency on
# any prior extraction. dbt-build/validate need data/staging/*.csv, which
# is gitignored (backlog.md #1) and not committed, so this workflow
# restores the same actions/cache scheduled-extraction.yml populates
# (read-only, via actions/cache/restore -- CI doesn't run extraction
# itself, so it never adds a new cache entry or hits any external source)
# instead of re-extracting on every push. On a fresh repo/fork with no
# scheduled-extraction run yet, the cache restore is a no-op and the
# dbt-build/validate step is skipped rather than failing the whole job.
#
# The same skip applies when the restored cache is *stale relative to this
# commit* rather than absent. The cache is only ever as new as the last
# scheduled extraction, so a PR that adds a source or a staging column is
# necessarily building against snapshots that predate it: the new source
# has no directory, and existing snapshots lack the new column. dbt reports
# that as "No files found that match the pattern ..." / "Referenced column
# ... not found in FROM clause", which looks like a code defect but is
# purely a cache-age artifact that resolves once the nightly cron re-runs.
# pipelines/schema_contracts.py checks the restored snapshots against the
# tracked data/staging/*.schema.json contracts so that case is skipped with
# an explanation instead of red-failing the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: make lint

      # tests/browser drives the built dashboard in headless Chromium
      # (docs/upgrade-plan-2027q1.md, U8). Without a browser those tests
      # skip, so this step is what makes them count in CI.
      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      # The responsive matrix (docs/upgrade-plan-2027q2.md, M1) runs its full
      # sweep under CI and saves every route at every width; the upload
      # below lets a reviewer see the phone and tablet layouts on every PR.
      - name: Test
        env:
          DASHBOARD_SCREENSHOT_DIR: ${{ runner.temp }}/dashboard-screenshots
        run: make test

      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: ${{ runner.temp }}/dashboard-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore staging snapshot history
        uses: actions/cache/restore@v4
        with:
          path: data/staging
          key: staging-snapshots-ci-noop
          restore-keys: |
            staging-snapshots-

      - name: dbt build + validate (if cached staging snapshots are usable)
        run: |
          set -euo pipefail
          if ! find data/staging -mindepth 2 -name '*.csv' -print -quit | grep -q .; then
            echo "No cached staging snapshots restored (fresh repo/fork, or scheduled-extraction hasn't run yet) -- skipping dbt-build/validate."
            exit 0
          fi
          if ! mismatches=$(uv run python -m pipelines.schema_contracts); then
            echo "::notice::Cached staging snapshots are older than this commit's staging contracts -- skipping dbt-build/validate."
            echo "$mismatches"
            echo "This is expected on a PR that adds a source or a staging column: CI never extracts, it"
            echo "reuses the cache scheduled-extraction.yml populates, so the data catches up on the next"
            echo "scheduled run. Verify dbt locally with 'make refresh' until then."
            exit 0
          fi
          make dbt-build
          make validate
