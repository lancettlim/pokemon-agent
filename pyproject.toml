[project]
name = "pokemon-champions-data-platform"
version = "0.1.0"
description = "Build/test tooling for the Pokémon Champions competitive data platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "dbt-core>=1.8,<2.0",
    "dbt-duckdb>=1.8,<2.0",
    "duckdb>=1.0",
    "playwright>=1.45",
    "jinja2>=3.1",
    # Reads dbt's schema.yml for the dashboard's generated data dictionary
    # (pipelines/dashboard/dictionary.py). Already a dbt dependency.
    "pyyaml>=6.0",
    # Only used to downscale PokéAPI HOME renders for the dashboard's hero
    # slots (pipelines/dashboard/sprites.py). Extraction deliberately does
    # not depend on it — image dimensions there come straight off the PNG
    # header.
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pokemon-champions-cli = "pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
